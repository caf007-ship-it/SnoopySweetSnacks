<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snoopy Sweet Snacks</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: "Gill Sans", Calibri, sans-serif;
    }
    canvas {
      display: none;
      background: #000;
    }
    .container {
      width: 400px;
    }
    .envelope-wrapper {
      position: relative;
      background-color: #d8a0f0;
      box-shadow: 0 0 40px rgba(0,0,0,0.2);
      border-radius: 15px;
    }
    .envelope {
      position: relative;
      width: 100%;
      height: 300px;
    }
    .letter {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      text-align: center;
      padding: 20px;
      border-radius: 10px;
    }
    .content {
      color: #333;
      font-size: 14px;
      text-align: left;
      line-height: 1.4em;
      height: 80%;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .btn-start {
      background: #a020f0;
      color: white;
      border: none;
      padding: 8px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none; /* prevent text selection */
      -webkit-user-select: none;
      -ms-user-select: none;
    }
    .btn-start:hover { background: #8000c0; }

    /* Touch controls */
    #mobileControls {
      display: none;
      position: fixed;
      bottom: 20px;
      width: 100%;
      justify-content: space-around;
      padding: 0 30px;
      z-index: 1000;
      touch-action: none; /* prevent default touch behavior */
    }
    #mobileControls button {
      width: 100px;
      height: 100px;
      font-size: 40px;
      border-radius: 20px;
      border: none;
      background: #a020f0;
      color: white;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }
    #mobileControls button:active { background: #8000c0; }
  </style>
</head>
<body>

<!-- Rules screen -->
<div id="intro" class="container">
  <div class="envelope-wrapper">
    <div class="envelope">
      <div class="letter">
        <div class="content">
          <h2>💌 Welcome to Snoopy Sweet Snacks</h2>
          <p>
            🎮 Game Rules:<br>
            - On PC, move Snoopy with the arrow keys ⬅️ ➡️.<br>
            - Catch strawberries 🍓 to earn points.<br>
            - Catch cherries 🍒 to regain a life (max 5 lives).<br>
            - If you drop 5 fruits, you lose the game 💔.
          </p>
          <p style="text-align:center; margin-top:15px; font-weight:bold;">
            🎉 Have fun! 🎉 <br>
            <span style="font-size:14px; color:#555;">Lovingly developed by Pedro Cauich</span>
          </p>
        </div>
        <button class="btn-start" id="btnStart">Start</button>
      </div>
    </div>
  </div>
</div>

<!-- Game canvas -->
<canvas id="gameCanvas"></canvas>

<!-- Touch controls -->
<div id="mobileControls">
  <button id="leftBtn">⬅️</button>
  <button id="rightBtn">➡️</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function isMobile() { return /Mobi|Android/i.test(navigator.userAgent); }

// --- IMAGES ---
const backgroundImg = new Image(); backgroundImg.src = "f1.jpg";
const snoopyImg = new Image(); snoopyImg.src = "i1.png";
const cherryImg = new Image(); cherryImg.src = "i2.jpeg";
const strawberryImg = new Image(); strawberryImg.src = "i3.jpeg";

// --- VARIABLES ---
let player, foods, keysPressed, score, misses, lastSpawn;
let gameStarted = false;
const maxFoods = 2, maxMisses = 5;
const foodSpeedBase = 3, foodSpeedMax = 8, spawnIntervalBase = 1000, spawnIntervalMin = 400;
let foodSpeed = foodSpeedBase, spawnInterval = spawnIntervalBase;

// Canvas resize
function resizeCanvas() {
  if(isMobile()){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  } else {
    canvas.width = 700;
    canvas.height = 500;
  }
}

// Initialize game
function resetGame(){
  resizeCanvas();
  const scale = canvas.width / 700;

  // calculate button height
  let buttonHeight = 0;
  if(isMobile()){
    const btnRect = document.getElementById("mobileControls").getBoundingClientRect();
    buttonHeight = btnRect.height;
  }

  player = { 
    width: 80*scale, 
    height: 80*scale, 
    speed: 10*scale,
    x: canvas.width/2 - (80*scale)/2,
    y: isMobile() ? canvas.height - buttonHeight - 20 - (80*scale) : canvas.height - (100*scale)
  };
  foods = [];
  keysPressed = { left:false, right:false };
  score = 0;
  misses = 0;
  lastSpawn = 0;
}

// Keyboard controls
document.addEventListener("keydown", e=>{
  if(e.code==="ArrowLeft") keysPressed.left=true;
  if(e.code==="ArrowRight") keysPressed.right=true;
});
document.addEventListener("keyup", e=>{
  if(e.code==="ArrowLeft") keysPressed.left=false;
  if(e.code==="ArrowRight") keysPressed.right=false;
});

// Touch controls
if(isMobile()){
  const mobileControls = document.getElementById("mobileControls");
  mobileControls.style.display="flex";
  ["leftBtn","rightBtn"].forEach(id=>{
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", e=>{ e.preventDefault(); keysPressed[id==="leftBtn"?"left":"right"]=true; });
    btn.addEventListener("touchend", e=>{ e.preventDefault(); keysPressed[id==="leftBtn"?"left":"right"]=false; });
  });
}

// Collision detection
function collide(a,b){
  return(a.x<b.x+b.width && a.x+a.width>b.x && a.y<b.y+b.height && a.y+a.height>b.y);
}

// Dynamic difficulty
function updateDifficulty(){
  foodSpeed = Math.min(foodSpeedBase + score*0.2, foodSpeedMax);
  spawnInterval = Math.max(spawnIntervalMin, spawnIntervalBase - score*15);
  foodSpeed += Math.sin(Date.now()/500)*0.5;
}

// Main loop
function gameLoop(timestamp){
  if(keysPressed.left && player.x>0) player.x -= player.speed;
  if(keysPressed.right && player.x+player.width<canvas.width) player.x += player.speed;

  updateDifficulty();

  if(!lastSpawn) lastSpawn = timestamp;
  if(timestamp-lastSpawn>spawnInterval && foods.length<maxFoods){
    let type = Math.random()<0.2?{img:cherryImg,life:true}:{img:strawberryImg,life:false};
    let foodSize = 40*(canvas.width/700);
    foods.push({
      x: Math.random()*(canvas.width-foodSize),
      y: -foodSize,
      width: foodSize,
      height: foodSize,
      image: type.img,
      life: type.life
    });
    lastSpawn = timestamp;
  }

  foods.forEach(f => f.y += foodSpeed);
  foods = foods.filter(f=>{
    if(collide(player,f)){
      score++;
      if(f.life) misses = Math.max(0, misses-1);
      return false;
    }
    if(f.y>canvas.height){ misses++; return false; }
    return true;
  });

  if(misses>=maxMisses){
    alert("💔 Game Over! Score: "+score);
    resetGame();
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(backgroundImg,0,0,canvas.width,canvas.height);
  ctx.drawImage(snoopyImg, player.x, player.y, player.width, player.height);
  foods.forEach(f => ctx.drawImage(f.image, f.x, f.y, f.width, f.height));

  ctx.fillStyle="#6a0dad";
  ctx.font = `${28*(canvas.width/700)}px Comic Sans MS`;
  ctx.textAlign="center";
  ctx.fillText("Sno
